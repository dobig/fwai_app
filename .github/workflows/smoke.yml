name: smoke

# Builds the app on macOS, launches it, and fails if it isn't idle when left
# alone (scripts/ci/macos-idle-smoke.sh). Kept out of ci.yml so that one stays
# a couple of minutes: this needs a real Rust build and a real window server.
#
# It exists because the bugs it catches are invisible everywhere else. v1.9.0
# shipped a resize → isMaximized → resize loop that only happens against
# AppKit with the simple-mode (non-resizable, overlay title bar) window: jsdom
# never sees it, `cargo test` never sees it, and on a dev machine it looks like
# "the app is a bit sluggish today". Here it reads 100% CPU on an idle app.
# The same build then quits and restarts (scripts/ci/macos-exit-smoke.sh):
# up to v1.10.1 both deadlocked, which also only shows against AppKit.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-idle:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install the Rust toolchain
        run: rustup show # rust-toolchain.toml pins the channel + components

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-smoke

      - run: pnpm install --frozen-lockfile

      - name: Build the app
        # Debug + no bundle: no signing or updater key needed, and the binary
        # still embeds the built frontend exactly like a release does.
        run: pnpm tauri build --debug --no-bundle

      - name: Give the runner a screen the window fits on
        # The runner boots at 1024x768, where the simple-mode window is pinned
        # at full height and a resize loop physically can't run — the smoke
        # check would pass a broken build. The script refuses to run on such a
        # screen; this makes it tall enough.
        run: ./scripts/ci/macos-tall-screen.sh

      - name: Leave it idle and check it stays idle
        env:
          SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/smoke
        run: |
          sw_vers
          ./scripts/ci/macos-idle-smoke.sh src-tauri/target/debug/fwai_app

      - name: Quit and restart it, and check neither hangs
        # The debug build's FWAI_SMOKE_EXIT hook walks the real quit and
        # restart paths; up to v1.10.1 both deadlocked into Not Responding.
        run: ./scripts/ci/macos-exit-smoke.sh src-tauri/target/debug/fwai_app

      - name: Keep the screenshot and app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-macos-idle
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
